# https://docs.atuin.sh/configuration/config/
# La clé de chiffrement et la session ne sont PAS ici (stockées dans ~/.local/share/atuin).
auto_sync = true
sync_frequency = "10m"
update_check = false

search_mode = "fuzzy"
filter_mode = "global"
filter_mode_shell_up_key_binding = "session"
style = "compact"
inline_height = 20
enter_accept = false
secrets_filter = true
